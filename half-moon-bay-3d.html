<main id="app">

    <nav class="top-tools" aria-label="游戏工具">

      <button id="chart" class="icon-button" aria-label="海图与沿岸地图" title="地图"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 7-2 6-6 4 2-6z"/></svg></button>

  </header>
  <section id="intro" class="intro">
    <div class="eyebrow"><i></i> DUNES · CREEKS · SURF</div>
    <h1>在沙丘之间。</h1>
    <p class="intro-copy">浅色沙丘，细长的浪和两道溪口。<br>沿着长滩，找到今天的钓点。</p>
    <button id="start" class="start-button" disabled><span>正在准备海岸</span><b>↗</b></button>
    <div class="intro-detail"><span>走过沙丘与溪口</span><i></i><span>寻找沙坝缺口</span><i></i><span>感受每一次咬钩</span></div>
  </section>
  <div id="intro-location" class="intro-location"><span>THE LONG GOLDEN BEACH</span><strong>Half Moon Bay</strong><small>37°28′ N &nbsp; 122°27′ W</small></div>
  <div id="loading-note" class="loading-note" role="status">正在准备海面与光照…</div>

    <div id="context-message" class="context-message" role="status" aria-live="polite"></div>
    <div class="bottom-left">

  <div id="dialog-layer" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button id="close-dialog" class="close-dialog" aria-label="关闭">×</button><div id="dialog-content"></div></section></div>
